<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

            h1, img 등은 선택자라고 한다(CSS 작업할 요소를 선택)
            CSS 속성을 이용해 값을 지정한다
        */
        h1 {
            color: deeppink;
            text-decoration: underline;
        }
        img {
            height:200px;
            border: 3px solid red;
        }
    </style>
    <title>Document</title>
</head>
<body>
    <h1>오늘의 초대 손님</h1>

</html>
