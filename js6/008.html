<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    #app {
      width: 1000px;
      margin: 0 auto;
    }
    header, nav, footer {
      height: 50px;
      line-height: 50px;
    }
    header {
      background-color: rgb(240, 240, 240);
      text-align: center;
      font-size: 2em;
      letter-spacing: 1em;
    }
    nav>ul {
      overflow: hidden;
      list-style: none;
      background-color: rgb(100,100,100);
    }
    nav>ul>li {
      float:left;
      width:100px;
    }
    nav>ul>li>a {
      color:white; 
      text-decoration: none;
      display: block;
      text-align: center;
    }
    nav>ul>li>a:hover {
      font-weight: bold;
      background-color: rgb(50,50,50);
    }
    main {
      overflow: hidden;
    }
    aside {
      width:100px;
      height:200px;
      border: 1px solid black;
      text-align: center;
      float: left;
    }
    section {
      width: 800px;
      min-height: 800px;
      padding: 15px;
      float:left;
    }
    .finish {
      text-decoration: line-through;
      font-style: italic;
    }
  </style>
  <title>Document</title>
</head>
<body>
  <div id="app">
    <header>Todos</header>
    <nav>
      <ul>
        <li><a href="#">HOME</a></li>
        <li><a href="#">연혁</a></li>
        <li><a href="#">제품</a></li>
        <li><a href="#">소개</a></li>
      </ul>
    </nav>
    <main>
      <aside>
        좌측 aside
      </aside>
      <section>
        <div class="mt-3 mb-3">
          <label class="form-label">작성자:</label>
          <select class="form-control" id="name">
            <option selected disabled>작성자 선택</option>
            <option>홍길동</option>
            <option>전우치</option>
            <option>임꺽정</option>
          </select>
        </div>
        <div class="mt-3 mb-3">
          <label class="form-label">할일:</label>
          <input type="text" class="form-control" id="title">
        </div>
        <div class="mt-3 mb-3">
          <label class="form-label">마감일:</label>
          <input type="date" class="form-control" id="deadline">
        </div>
        <div class="d-grid mt-3 mb-3">
          <button type="button" class="btn btn-outline-primary btn-block" onclick="작성();">작성</button>
        </div>
        <table class="table table-hover mt-3">
          <thead>
            <tr>
              <th>작성자</th>
              <th>할일</th>
              <th>마감일</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody">
          </tbody>
        </table>
      </section>
      <aside>
        우측 aside
      </aside>
    </main>
    <footer>
      copyright &copy;2025 ICIA
    </footer>
  </div>
  <script>
    let tno = 1;
    const todos = [];
    const $title = document.getElementById('title');
    const $name = document.getElementById('name');
    const $deadline = document.getElementById('deadline');
    const $tbody = document.getElementById('tbody');

    function 작성() {
      const title = $title.value;
      const name = $name.value;
      const deadline = $deadline.value;
      const todo = {tno, title, name, deadline, finish:false}; 
      todos.push(todo);
      출력();
    }

    function 출력() {
      let html='';
      for(const todo of todos) {
        html+=`
          <tr class='${todo.finish?"finish":""}'>
            <td>${todo.name}</td>
            <td onclick='변경(${todo.tno})'>${todo.title} ${todo.finish?"(완료)":""}</td>
            <td>${todo.deadline}</td>
            <td>
              <button class='btn btn-danger' onclick='삭제(${todo.tno});'>삭제</button>
            </td>
          </tr>
        `;
      }
      $tbody.innerHTML = html;
    }

    function 변경(tno) {
      for(const todo of todos) {
        if(todo.tno===tno) {
          todo.finish = !todo.finish;
        }
      }
      출력();
    }

    function 삭제(tno) {
      for(let i=0;i<todos.length; i++) {
        if(todos[i].tno===tno) {
          todos.splice(i, 1);
          break;
        }
      }
      출력();
    }
  </script>
</body>
</html>
