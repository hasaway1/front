<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 값 2개를 입력받으세요 -> 값 1개씩 두번 받으세요
        // 가로 길이, 세로 길이를 입력받아 평을 출력하시오
        const 가로 = prompt("가로의 길이");
        const 세로 = prompt("세로의 길이");
        const 평 = (가로 * 세로) / 3.3;
        console.log("면적:", 평, "평");
    </script>
</body>
