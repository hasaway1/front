<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반복문: 여러개의 데이터를 처리</title>
</head>
<body>
  <script>
    // number 배열
    const scores = [75,65,90];
    // of 반복문 : 배열의 원소를 하나씩 꺼내자
    for(const score of scores) {
      console.log(score);
    }

    const s1 = 75;
    const s2 = 65;
    const s3 = 90;
    console.log(s1);
    console.log(s2);
    console.log(s3);
  </script>
</body>
</html>
